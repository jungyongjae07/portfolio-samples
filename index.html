<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portfolio Samples</title>
<style>
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
    font-family: -apple-system, sans-serif; background:#111; color:#eee; }
  .card { display:flex; gap:1.5rem; flex-wrap:wrap; padding:2rem; }
  a.tile { display:block; width:260px; padding:1.5rem; border:1px solid #333; border-radius:10px;
    color:#eee; text-decoration:none; background:#1a1a1a; transition:transform .2s; }
  a.tile:hover { transform:translateY(-3px); border-color:#666; }
  a.tile h2 { margin:0 0 .5rem; font-size:1.1rem; }
  a.tile p { margin:0; color:#999; font-size:.85rem; }
</style>
</head>
<body>
  <div class="card">
    <a class="tile" href="jae-codes/"><h2>jae.codes</h2><p>Developer portfolio, code-editor concept</p></a>
    <a class="tile" href="salt-and-still/"><h2>Salt & Still</h2><p>Boutique wellness studio landing page</p></a>
  </div>
</body>
</html>
