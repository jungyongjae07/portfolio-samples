<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Exhibitions — Halden Gallery</title>
<meta name="description" content="Current, upcoming, and past exhibitions at Halden Gallery.">
<meta property="og:type" content="website">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,400;0,500;0,600;1,400&family=Archivo:wght@400;500;600&display=swap" rel="stylesheet">

<style>
  :root{
    --bg:#FFFFFF; --surface:#FAF9F6; --surface-2:#EFEDE6;
    --ink:#171614; --ink-soft:#5C574E; --ink-faint:#938D80;
    --border:#E2DFD5; --border-strong:#CFC9B8;
    --accent:#1F5E52; --accent-ink:#FFFFFF;
  }
  *{box-sizing:border-box;}
  body{ margin:0; background:var(--bg); color:var(--ink); font-family:'Archivo', Arial, sans-serif; -webkit-font-smoothing:antialiased; }
  h1,h2,.serif{ font-family:'Spectral', Georgia, serif; font-weight:500; margin:0; }
  a{ color:inherit; text-decoration:none; }
  .wrap{ max-width:1180px; margin:0 auto; padding:0 24px; }

  header{ position:sticky; top:0; z-index:40; background:var(--bg); border-bottom:1px solid var(--border); }
  nav.wrap{ display:flex; align-items:center; justify-content:space-between; padding-top:20px; padding-bottom:20px; }
  .wordmark{ font-family:'Spectral', Georgia, serif; font-size:21px; font-weight:600; }
  .nav-links{ display:flex; gap:30px; list-style:none; margin:0; padding:0; }
  .nav-links a{ font-size:14px; color:var(--ink-soft); }
  .nav-links a:hover, .nav-links a.active{ color:var(--ink); }

  .page-head{ padding:56px 0 40px; }
  .page-head h1{ font-size:40px; margin-bottom:10px; }
  .page-head p{ color:var(--ink-soft); font-size:15px; }

  .filter-row{ display:flex; gap:10px; padding-bottom:32px; }
  .filter-pill{
    font-size:13px; padding:8px 16px; border-radius:999px; border:1px solid var(--border-strong);
    background:none; color:var(--ink-soft); cursor:pointer; font-family:'Archivo', sans-serif;
  }
  .filter-pill.active, .filter-pill:hover{ border-color:var(--ink); color:var(--ink); background:var(--surface-2); }

  .exh-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:24px; padding-bottom:96px; }
  .exh-card .art{ aspect-ratio:4/5; border-radius:2px; overflow:hidden; background:var(--surface-2); margin-bottom:14px; transition:transform 220ms ease; }
  .exh-card:hover .art{ transform:translateY(-4px); }
  .exh-card .name{ font-size:17px; font-weight:500; font-family:'Spectral', serif; }
  .exh-card .meta{ font-size:13px; color:var(--ink-faint); margin-top:3px; }
  .exh-card .status{ font-size:12px; color:var(--accent); font-weight:600; margin-top:6px; }

  footer{ padding:40px 0; border-top:1px solid var(--border); font-size:12px; color:var(--ink-faint); text-align:center; }

  @media (max-width: 860px){
    .nav-links{ display:none; }
    .exh-grid{ grid-template-columns:repeat(2,1fr); }
  }
</style>
</head>
<body>

<header>
  <nav class="wrap">
    <a href="index.html" class="wordmark">Halden Gallery</a>
    <ul class="nav-links">
      <li><a href="exhibitions.html" class="active">Exhibitions</a></li>
      <li><a href="artists.html">Artists</a></li>
      <li><a href="index.html#visit">Visit</a></li>
    </ul>
  </nav>
</header>

<div class="wrap page-head">
  <h1>Exhibitions</h1>
  <p>One show at a time, roughly six weeks each.</p>
</div>

<div class="wrap">
  <div class="filter-row" id="filter-row">
    <button class="filter-pill active" data-f="all">All</button>
    <button class="filter-pill" data-f="current">Current</button>
    <button class="filter-pill" data-f="upcoming">Upcoming</button>
    <button class="filter-pill" data-f="past">Past</button>
  </div>
  <div class="exh-grid" id="exh-grid"></div>
</div>

<footer>&copy; 2026 Halden Gallery. A demo portfolio site — not a real gallery. Made by <a href="https://www.fiverr.com/freelancejae" style="text-decoration:underline;">FreelanceJae</a>.</footer>

<script>
  var EXHIBITIONS = [
    { id:"slow-light", name:"Slow Light", meta:"Group show, six artists", status:"current", statusLabel:"On view through Mar 2026", art:"curves" },
    { id:"low-relief", name:"Low Relief", meta:"Solo — Marta Yun", status:"upcoming", statusLabel:"Opens Apr 2026", art:"blocks" },
    { id:"field-notes", name:"Field Notes", meta:"Group show, four artists", status:"past", statusLabel:"Closed Jan 2026", art:"grain" },
    { id:"quiet-machines", name:"Quiet Machines", meta:"Solo — Peter Nakada", status:"past", statusLabel:"Closed Nov 2025", art:"lines" }
  ];
  var ART = {
    curves: '<g stroke="var(--accent)" stroke-width="1.2" fill="none" opacity="0.8"><path d="M40 250 C 90 180, 110 120, 70 40"/><path d="M90 270 C 150 210, 180 140, 150 30"/></g>',
    blocks: '<g fill="none" stroke="var(--ink-soft)" stroke-width="1.2" opacity="0.7"><rect x="40" y="60" width="90" height="60"/><rect x="150" y="140" width="70" height="90"/><rect x="60" y="200" width="60" height="50"/></g>',
    grain: '<g stroke="var(--ink-faint)" stroke-width="1" opacity="0.6">' +
      Array.from({length:24}).map(function(_,i){ var x=30+(i%6)*40, y=40+Math.floor(i/6)*50; return '<circle cx="'+x+'" cy="'+y+'" r="'+(4+(i%3)*3)+'"/>'; }).join('') +
      '</g>',
    lines: '<g stroke="var(--ink-soft)" stroke-width="1" opacity="0.7">' +
      Array.from({length:8}).map(function(_,i){ return '<line x1="20" y1="'+(30+i*28)+'" x2="240" y2="'+(30+i*28+(i%2?10:-10))+'"/>'; }).join('') +
      '</g>'
  };

  var grid = document.getElementById('exh-grid');
  var active = 'all';

  function render(){
    var items = EXHIBITIONS.filter(function(e){ return active === 'all' || e.status === active; });
    grid.innerHTML = items.map(function(e){
      return '' +
        '<a href="exhibition.html?id=' + e.id + '" class="exh-card">' +
        '  <div class="art"><svg viewBox="0 0 260 260" width="100%" height="100%"><rect width="260" height="260" fill="var(--surface-2)"/>' + ART[e.art] + '</svg></div>' +
        '  <div class="name">' + e.name + '</div>' +
        '  <div class="meta">' + e.meta + '</div>' +
        '  <div class="status">' + e.statusLabel + '</div>' +
        '</a>';
    }).join('');
  }
  render();

  document.getElementById('filter-row').addEventListener('click', function(e){
    var btn = e.target.closest('.filter-pill');
    if (!btn) return;
    document.querySelectorAll('.filter-pill').forEach(function(p){ p.classList.remove('active'); });
    btn.classList.add('active');
    active = btn.dataset.f;
    render();
  });
</script>

</body>
</html>
